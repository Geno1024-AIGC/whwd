name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A ${{ matrix.cmake_arch }}
      - name: Build
        run: cmake --build build --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whwd-${{ matrix.arch }}
          path: |
            build/Release/whwd.exe
            build/Release/whwd-gui.exe